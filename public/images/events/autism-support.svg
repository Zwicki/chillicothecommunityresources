<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="150" cy="120" r="140" fill="#3b82f6" opacity="0.18"/>
  <circle cx="680" cy="480" r="150" fill="#818cf8" opacity="0.18"/>

  <rect x="40" y="40" width="720" height="520" rx="24" fill="#090d16" fill-opacity="0.65" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2"/>

  <g transform="translate(400, 95)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#312e81" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e0e7ff" letter-spacing="2">PARENT TO PARENT SUPPORT</text>
  </g>

  <text x="400" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">Autism &amp; Special Needs Support Group</text>
  <text x="400" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Connecting Parents, Caregivers &amp; Families in Chillicothe</text>

  <g transform="translate(120, 280)">
    <rect width="560" height="130" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1.5"/>
    
    <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1">WHEN</text>
    <text x="35" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">November 19, 2026</text>
    <text x="35" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">6:00 PM – 7:30 PM</text>

    <text x="320" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1">LOCATION</text>
    <text x="320" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">147 North Bridge Street</text>
    <text x="320" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#c7d2fe">Chillicothe, OH 45601</text>
  </g>

  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e0e7ff">A safe, welcoming space to share experiences, guidance, and community</text>
  <text x="400" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#93c5fd">Open to all parents and guardians • Free attendance</text>
</svg>
