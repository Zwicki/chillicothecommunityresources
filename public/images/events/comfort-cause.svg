<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fireIce" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="150" fill="#0284c7" opacity="0.2"/>
  <circle cx="700" cy="480" r="160" fill="#ea580c" opacity="0.18"/>

  <rect x="40" y="40" width="720" height="520" rx="24" fill="#030712" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400, 95)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e0f2fe" letter-spacing="2">CHILLICOTHE COMFORT HEATING &amp; AIR</text>
  </g>

  <text x="400" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#fireIce)" letter-spacing="-0.5">Take the Chill Out of Chillicothe! ❄️❤️</text>
  <text x="400" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">1st Annual Comfort For A Cause</text>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Free Furnace Safety Inspections for Seniors, Veterans &amp; Families in Need</text>

  <g transform="translate(120, 290)">
    <rect width="560" height="130" rx="16" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.5"/>
    
    <text x="35" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">INITIATIVE</text>
    <text x="35" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Free Weekend Home Inspections</text>
    <text x="35" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#bae6fd">Volunteered by Chillicothe Comfort technicians</text>

    <text x="330" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1">HOW TO APPLY</text>
    <text x="330" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">comfort4acause.netlify.app</text>
    <text x="330" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#fde68a">Apply online or nominate a neighbor</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Keeping our neighbors warm and safe throughout the winter season</text>
  <text x="400" y="508" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Chillicothe Comfort Heating &amp; Cooling • Giving back to the community we love</text>
</svg>
