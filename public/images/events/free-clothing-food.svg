<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="120" cy="100" r="150" fill="#10b981" opacity="0.2"/>
  <circle cx="700" cy="500" r="160" fill="#14b8a6" opacity="0.18"/>

  <rect x="40" y="40" width="720" height="520" rx="24" fill="#022c22" fill-opacity="0.65" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400, 100)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#047857" fill-opacity="0.5" stroke="#34d399" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" letter-spacing="2">COMMUNITY OUTREACH</text>
  </g>

  <text x="400" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#glowGrad)" letter-spacing="-0.5">Free Clothing, Food &amp; Hygiene</text>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#d1fae5">Free essential supplies for individuals and families in Ross County</text>

  <g transform="translate(120, 290)">
    <rect width="560" height="130" rx="16" fill="#064e3b" fill-opacity="0.75" stroke="#047857" stroke-width="1.5"/>
    
    <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1">WHEN</text>
    <text x="35" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">November 5, 2026</text>
    <text x="35" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#a7f3d0">10:00 AM – 2:00 PM</text>

    <text x="320" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1">LOCATION</text>
    <text x="320" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">63 E. Water Street</text>
    <text x="320" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a7f3d0">Chillicothe, OH 45601</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ecfdf5">Free clothes, pantry goods &amp; hygiene care items</text>
  <text x="400" y="508" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6ee7b7">Open to all community members in need • No cost</text>
</svg>
