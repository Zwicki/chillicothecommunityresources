<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative Orbs -->
  <circle cx="100" cy="80" r="160" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="700" cy="520" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Central Card -->
  <rect x="40" y="40" width="720" height="520" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Header Badge -->
  <g transform="translate(400, 95)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc" letter-spacing="2">SERENITY WELLNESS CENTER</text>
  </g>

  <!-- Heart / Hope Icon -->
  <g transform="translate(400, 165)">
    <circle cx="0" cy="0" r="32" fill="#0284c7" fill-opacity="0.3"/>
    <path d="M0 12 C -20 -10, -30 -22, -18 -32 C -8 -40, 0 -26, 0 -26 C 0 -26, 8 -40, 18 -32 C 30 -22, 20 -10, 0 12 Z" fill="#38bdf8" transform="translate(0, 14) scale(0.9)"/>
  </g>

  <!-- Title -->
  <text x="400" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Free Grief Support Group</text>
  <text x="400" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">In loving remembrance of Jody Wilson &amp; for all in our community</text>

  <!-- Divider Line -->
  <line x1="280" y1="310" x2="520" y2="310" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Schedule / Details Box -->
  <g transform="translate(120, 335)">
    <rect width="560" height="110" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Date & Time -->
    <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">DATES &amp; TIME</text>
    <text x="30" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Saturday, Nov 7 &amp; Nov 14</text>
    <text x="30" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">11:00 AM – 1:00 PM</text>

    <!-- Location -->
    <text x="320" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">LOCATION</text>
    <text x="320" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">637 Central Center</text>
    <text x="320" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Chillicothe, OH 45601</text>
  </g>

  <!-- Facilitators & Note -->
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Facilitated by Michelle Gilmore &amp; Rick Fannin</text>
  <text x="400" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Refreshments Provided • No Registration Required • Everyone Welcome</text>
</svg>
