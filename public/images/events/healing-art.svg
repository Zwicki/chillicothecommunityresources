<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="150" cy="120" r="140" fill="#ec4899" opacity="0.2"/>
  <circle cx="680" cy="480" r="160" fill="#3b82f6" opacity="0.2"/>

  <!-- Frame -->
  <rect x="40" y="40" width="720" height="520" rx="24" fill="#09090b" fill-opacity="0.6" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Badge -->
  <g transform="translate(400, 100)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#581c87" fill-opacity="0.6" stroke="#a855f7" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff" letter-spacing="2">SPVMHC ANNUAL ART SHOW</text>
  </g>

  <!-- Title -->
  <text x="400" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#artGrad)" letter-spacing="-1">Healing Through Art</text>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#d4d4d8">Celebrating Creativity, Healing &amp; Community Expression</text>

  <!-- Details Card -->
  <g transform="translate(120, 310)">
    <rect width="560" height="130" rx="16" fill="#18181b" fill-opacity="0.8" stroke="#3f3f46" stroke-width="1.5"/>
    
    <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="1">WHEN</text>
    <text x="35" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">November 5, 2026</text>
    <text x="35" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#a1a1aa">5:00 PM – 7:00 PM</text>

    <text x="320" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="1">WHERE</text>
    <text x="320" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">4449 OH-159</text>
    <text x="320" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a1a1aa">Chillicothe, OH 45601</text>
  </g>

  <text x="400" y="495" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e4e4e7">All individuals receiving services encouraged to contribute • Public welcome</text>
</svg>
