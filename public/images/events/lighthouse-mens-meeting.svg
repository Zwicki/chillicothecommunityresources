<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a36"/>
      <stop offset="40%" stop-color="#09294f"/>
      <stop offset="100%" stop-color="#03162b"/>
    </linearGradient>
    <linearGradient id="beaconLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03162b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Beacon Light Rays -->
  <polygon points="120,80 800,0 800,280" fill="url(#beaconLight)"/>

  <!-- Frame -->
  <rect x="35" y="35" width="730" height="530" rx="24" fill="#031528" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Top Badge -->
  <g transform="translate(400, 85)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#0369a1" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e0f2fe" letter-spacing="2">THE LIGHT HOUSE • HOPE • SUPPORT • RECOVERY</text>
  </g>

  <!-- Title -->
  <text x="400" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#blueGrad)" letter-spacing="-0.5">MEN'S MEETING GROUP</text>
  <text x="400" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" letter-spacing="1">Come Together • Talk • Support • Grow</text>
  <text x="400" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">You're Not Alone! Recovery is Stronger Together.</text>

  <!-- Schedule & Location Box -->
  <g transform="translate(110, 275)">
    <rect width="580" height="150" rx="18" fill="#061f3d" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Time & Schedule -->
    <text x="35" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1.5">WHEN (WEEKLY RECURRING)</text>
    <text x="35" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff">EVERY MONDAY</text>
    <text x="35" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">5:00 PM – 6:00 PM</text>
    <text x="35" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SMART Recovery • AA &amp; NA Welcome</text>

    <!-- Location -->
    <text x="330" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1.5">LOCATION</text>
    <text x="330" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">The Light House</text>
    <text x="330" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">291 S Paint Street</text>
    <text x="330" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Chillicothe, OH 45601</text>
  </g>

  <!-- Footer Banner -->
  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0f2fe">All Men Welcome! Meet • Share • Heal • Build a Better Tomorrow</text>
  <text x="400" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">Free Weekly Community Support Meeting • Open Topic</text>
</svg>
