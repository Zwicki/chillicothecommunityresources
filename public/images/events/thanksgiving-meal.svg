<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="150" fill="#f97316" opacity="0.18"/>
  <circle cx="700" cy="500" r="160" fill="#ef4444" opacity="0.18"/>

  <rect x="40" y="40" width="720" height="520" rx="24" fill="#270e04" fill-opacity="0.65" stroke="#f97316" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(400, 95)">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#9a3412" fill-opacity="0.6" stroke="#fdba74" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffedd5" letter-spacing="2">ANNUAL COMMUNITY TRADITION</text>
  </g>

  <text x="400" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#warmGrad)" letter-spacing="-0.5">Thanksgiving Community Free Meal</text>
  <text x="400" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#fed7aa">Full Thanksgiving Dinner • Eat In or Carryout</text>

  <g transform="translate(120, 275)">
    <rect width="560" height="135" rx="16" fill="#451a03" fill-opacity="0.85" stroke="#9a3412" stroke-width="1.5"/>
    
    <text x="35" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fdba74" letter-spacing="1">WHEN</text>
    <text x="35" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Sunday, Nov 15, 2026</text>
    <text x="35" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#fed7aa">12:00 PM – 1:00 PM</text>

    <text x="320" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fdba74" letter-spacing="1">LOCATION</text>
    <text x="320" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ffffff">17264 High Street</text>
    <text x="320" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#fed7aa">Clarksburg, OH 43115</text>
  </g>

  <text x="400" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffedd5">🦃 Turkey &amp; noodles, mashed potatoes, dressing, green beans, corn &amp; pumpkin pie!</text>
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#fca5a5">Completely Free • Open to everyone in Ross County &amp; neighboring communities</text>
</svg>
